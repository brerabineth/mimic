name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile
        run: javac -encoding UTF-8 -d build $(Get-ChildItem -Recurse src/mimic/*.java | ForEach-Object FullName)
        shell: pwsh
        if: runner.os == 'Windows'
      - name: Compile
        run: javac -encoding UTF-8 -d build $(find src -name '*.java')
        if: runner.os != 'Windows'
      - name: Selftest
        run: java -cp build mimic.Main selftest

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build jar
        run: ./build.sh
      - name: E2E
        run: ./test/e2e_local.sh

  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build jar
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mimic.jar
          path: dist/mimic.jar
