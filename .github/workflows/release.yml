name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: ./build.sh
      - name: Verify
        run: |
          java -jar dist/mimic.jar selftest
          java -jar dist/mimic.jar forge /tmp/verify-fx
          java -jar dist/mimic.jar scan /tmp/verify-fx >/dev/null 2>&1 || [ $? -eq 10 ]
      - name: Checksums
        run: |
          cd dist
          sha256sum mimic.jar > SHA256SUMS
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mimic.jar
            dist/SHA256SUMS
